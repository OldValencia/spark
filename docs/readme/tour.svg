<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">A guide to the Spark header</title><desc id="desc">The mascot points out site tabs, the All sites grid, the drag handle, window size, options with settings and extensions, and hide controls. This is an illustration of the shell.</desc>
  <g font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L6 3.5L0 7" fill="none" stroke="#b19470" stroke-width="1.2"/></marker></defs>
  <rect width="1200" height="440" rx="24" fill="#191a1e"/>
  <g transform="translate(56 20) scale(2.2)">
    <path d="M16 12C16 9 18 8 20 5C22 8 24 9 24 12Z" fill="#dfb584"/>
    <rect x="4" y="11" width="32" height="28" rx="10" fill="#45434a" stroke="#b19470" stroke-opacity=".8"/>
    <g fill="#f7e7ca" transform="translate(1 0)">
      <ellipse cx="14" cy="25" rx="2.6" ry="5"/>
      <ellipse cx="26" cy="25" rx="2.6" ry="5"/></g></g>
  <text x="174" y="70" font-size="30" fill="#f2eadc" font-weight="600">I'll show you around.</text>
  <text x="174" y="100" font-size="17" fill="#b3b1b9" >The website gets the big space. This little strip is Spark.</text>
  <text x="468" y="153" font-size="19" fill="#f2eadc" >Your sites</text>
  <text x="468" y="176" font-size="14" fill="#b3b1b9" >Find, add, reorder. Ctrl + Shift + L.</text>
  <path d="M546 184V211" fill="none" stroke="#b19470" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="944" y="153" font-size="19" fill="#f2eadc" >Back to your work</text>
  <text x="944" y="176" font-size="14" fill="#b3b1b9" >Hide the window. Keep the page.</text>
  <path d="M1116 184V211" fill="none" stroke="#b19470" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="44" y="220" width="1112" height="64" rx="14" fill="#25262a" stroke="#42434b"/>
  <g transform="translate(62 230) scale(1)">
    <path d="M16 12C16 9 18 8 20 5C22 8 24 9 24 12Z" fill="#dfb584"/>
    <rect x="4" y="11" width="32" height="28" rx="10" fill="#45434a" stroke="#b19470" stroke-opacity=".8"/>
    <g fill="#f7e7ca" transform="translate(-1 0)">
      <ellipse cx="14" cy="25" rx="2.6" ry="4.5"/>
      <ellipse cx="26" cy="25" rx="2.6" ry="4.5"/></g></g>
  <rect x="124" y="235" width="144" height="34" rx="8" fill="#343a39" stroke="#647d75"/>
  <circle cx="143" cy="252" r="4" fill="#a7c9bd"/>
  <text x="156" y="257" font-size="15" fill="#f2eadc" >ChatGPT</text>
  <circle cx="291" cy="252" r="4" fill="#d99a7c"/>
  <text x="304" y="257" font-size="15" fill="#f2eadc" >Claude</text>
  <circle cx="407" cy="252" r="4" fill="#c3c3cc"/>
  <text x="420" y="257" font-size="15" fill="#f2eadc" >Notes</text>
  <g fill="none" stroke="#c3c3cc" stroke-width="1.7">
  <rect x="537" y="243" width="7" height="7" rx="1.5"/><rect x="550" y="243" width="7" height="7" rx="1.5"/>
  <rect x="537" y="256" width="7" height="7" rx="1.5"/><rect x="550" y="256" width="7" height="7" rx="1.5"/></g>
  <path d="M770 252H796" stroke="#6c6d76" stroke-width="4" stroke-linecap="round"/>
  <g fill="none" stroke="#c3c3cc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="970" y="235" width="34" height="34" rx="8" stroke="#494a53"/>
    <path d="M980 249V244H985M994 255V260H989M980 244L985 249M994 260L989 255"/>
    <path d="M1108 255L1115 248L1122 255"/>
  </g>
  <g fill="#c3c3cc"><circle cx="1049" cy="252" r="1.6"/><circle cx="1057" cy="252" r="1.6"/><circle cx="1065" cy="252" r="1.6"/></g>
  <path d="M226 332V294" fill="none" stroke="#b19470" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="88" y="363" font-size="20" fill="#f2eadc" >Switch sites</text>
  <text x="88" y="387" font-size="14" fill="#b3b1b9" >Your draft stays. Right-click for its menu.</text>
  <path d="M782 332V294" fill="none" stroke="#b19470" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="647" y="363" font-size="20" fill="#f2eadc" >Move or dock</text>
  <text x="647" y="387" font-size="14" fill="#b3b1b9" >Drag here. Double-click to dock.</text>
  <path d="M942 332L981 294" fill="none" stroke="#b19470" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="902" y="363" font-size="18" fill="#f2eadc" >Window size</text>
  <text x="902" y="387" font-size="14" fill="#b3b1b9" >Size, pin, dock.</text>
  <path d="M1080 332L1060 294" fill="none" stroke="#b19470" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="1052" y="363" font-size="18" fill="#f2eadc" >Options</text>
  <text x="1052" y="387" font-size="14" fill="#b3b1b9" >Settings, extensions.</text>
  </g>
</svg>

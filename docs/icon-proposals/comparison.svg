<svg xmlns="http://www.w3.org/2000/svg" width="1184" height="1000" viewBox="0 0 1184 1000" role="img" aria-labelledby="title desc">
<title id="title">Sparky / Spark icon proposals</title>
<desc id="desc">Three transparent vector icon concepts on dark and light backgrounds, with actual-size samples and dedicated 16-pixel versions. Original Sparky preserves the existing mascot. Amber Sparky reverses the face colors. Pocket Sparky uses a wider pill silhouette.</desc>
<rect width="1184" height="1000" fill="#141518"/>
<g font-family="Segoe UI, system-ui, sans-serif">
<text x="28" y="46" font-size="13" fill="#dfb584" letter-spacing="2">SPARK / MEET SPARKY</text><text x="28" y="94" font-size="36" fill="#f2eadc" font-weight="600">A familiar face for the app icon.</text><text x="28" y="125" font-size="15" fill="#b3b1b9" >Three directions. Transparent SVG artwork. Dedicated small-size drawings. View at 100% for actual sizes.</text>
<g transform="translate(28 150)">

plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'to.sparkapp'
version = project.findProperty('app.version')

repositories {
    mavenCentral()
    maven { url = 'https://repo.casterlabs.co/maven' }
}

processResources {
    filesMatching('app.properties') {
        expand(project.properties)
    }
}

javafx {
    version = "25.0.5"
    modules = [ 'javafx.controls', 'javafx.swing' ]
}

def junitVersion = '5.10.2'
def lombokVersion = '1.18.42'

def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
def isMac = org.gradle.internal.os.OperatingSystem.current().isMacOsX()

def javaOpts = [
        '-Xms24m',
        '-Xmx96m',
        '-Xss512k',

        '-XX:MaxMetaspaceSize=64m',
        '-XX:MetaspaceSize=16m',

        // Serial GC: for a heap this small its pauses stay within a few milliseconds, and it needs about 55 MB
        // and 19 threads less than G1, whose marking stack and per-core workers outgrow the heap itself.
        '-XX:+UseSerialGC',
        '-XX:MinHeapFreeRatio=5',
        '-XX:MaxHeapFreeRatio=15',
        // Unload compiled code only after the code cache grows by half, not by the default 15 %: with Serial
        // GC each unloading is a full collection, which during startup took up to 30 ms.
        '-XX:SweeperThreshold=50',

        '-XX:+UseStringDeduplication',
        '-XX:StringTableSize=40009',

        '-XX:+TieredCompilation',
        '-XX:+OptimizeStringConcat',
        '-XX:+UseCompressedOops',
        // Smaller object headers (JDK 25): less Java heap for the same objects.
        '-XX:+UseCompactObjectHeaders',

        '-XX:ReservedCodeCacheSize=32m',
        '-XX:InitialCodeCacheSize=4m',

        // JavaFX draws Spark's windows; Java2D only renders icons into memory and the tray uses native menus.
        // Without this, starting the tray also starts Java2D's Direct3D device: about 45 MB and 20 threads.
        '-Dsun.java2d.d3d=false',

        // Classes loaded and linked ahead of time, from a training run (see generateAot).
        "-XX:AOTCache=\$APPDIR/spark.aot",

        // JNA and JNativeHook call native code; JDK 25 warns unless this is allowed explicitly.
        '--enable-native-access=ALL-UNNAMED',

        '--add-exports=java.base/java.lang=ALL-UNNAMED',
        '--add-exports=java.desktop/sun.awt=ALL-UNNAMED',
        '--add-exports=java.desktop/sun.java2d=ALL-UNNAMED',
        '--add-opens=java.desktop/sun.awt=ALL-UNNAMED',
]

// These packages exist only in the macOS JDK; elsewhere the JVM warns that they are missing.
if (isMac) {
    javaOpts += [
            '--add-opens=java.desktop/sun.lwawt=ALL-UNNAMED',
            '--add-opens=java.desktop/sun.lwawt.macosx=ALL-UNNAMED',
    ]
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'to.sparkapp.app.Launcher'
    applicationName = 'Spark'
    applicationDefaultJvmArgs = javaOpts
}

// A development run has no AOT cache, and the JavaFX plugin puts JavaFX on the module path, so its
// graphics module needs native access of its own (the installed app loads JavaFX from the classpath).
tasks.named('run') {
    jvmArgs = javaOpts.findAll { !it.startsWith('-XX:AOTCache=') }.collect {
        it.startsWith('--enable-native-access=') ? '--enable-native-access=ALL-UNNAMED,javafx.graphics' : it
    }
}

distributions {
    main {
        contents {
            // jpackage uses lib as its input, so legal notices belong here too.
            into('lib/legal') {
                from('LICENSE', 'THIRD_PARTY_NOTICES.md')
                into('third-party-licenses') {
                    from('third-party-licenses')
                }
            }
        }
    }
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'
    // Draws the bundled site logos; FlatLaf was only used for its SVG icon on top of this.
    implementation 'com.github.weisj:jsvg:2.0.0'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'ch.qos.logback:logback-classic:1.6.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
    implementation 'com.github.kwhat:jnativehook:2.2.2'

    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"

    testImplementation "org.junit.jupiter:junit-jupiter-api:$junitVersion"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junitVersion"
    // Gradle 9 no longer provides the launcher for the JUnit Platform.
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'native' }
}

def nativeTestDirectory = layout.buildDirectory.dir("native-tests/${UUID.randomUUID()}")
def testWebviewCleanup = layout.projectDirectory.file('tools/testing/stop-test-webviews.ps1')

tasks.register('cleanupNativeTestWebviews', Exec) {
    description = 'Stops remaining WebView2 processes belonging to this native test run.'
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isWindows() }
    commandLine 'powershell.exe', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
            '-File', testWebviewCleanup.asFile.absolutePath,
            '-ProfileRoot', nativeTestDirectory.get().dir('browser').asFile.absolutePath
}

tasks.register('cleanupOrphanedNativeTestWebviews', Exec) {
    description = 'Releases abandoned test profiles before deleting build output.'
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isWindows() }
    commandLine 'powershell.exe', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
            '-File', testWebviewCleanup.asFile.absolutePath,
            '-ProfileRoot', layout.buildDirectory.dir('native-tests').get().asFile.absolutePath,
            '-OrphansOnly'
}

tasks.named('clean') {
    dependsOn 'cleanupOrphanedNativeTestWebviews'
}

tasks.register('nativeTest', Test) {
    description = 'Exercises real WebView2 using an isolated disposable browser profile.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'native'
        if (!project.hasProperty('includeFlaky')) {
            excludeTags 'flaky'
        }
    }
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isWindows() }
    // Never inherit the installed application's profile or user preferences.
    def isolated = nativeTestDirectory.get().asFile
    environment 'WEBVIEW2_USER_DATA_FOLDER', new File(isolated, 'browser').absolutePath
    systemProperty 'spark.dataDir', new File(isolated, 'settings').absolutePath
    systemProperty 'spark.nativeTests', 'true'
    systemProperty 'spark.testRuntimeClasspath', sourceSets.test.runtimeClasspath.asPath
    outputs.upToDateWhen { false }
    testLogging { events 'passed', 'failed', 'standardOut', 'standardError' }
    finalizedBy 'cleanupNativeTestWebviews'
}

def readmeCaptureDirectory = layout.buildDirectory.dir('readme-capture')

tasks.register('readmeCapture', JavaExec) {
    description = 'Records README media from a real Spark instance with a disposable profile. Moves the real mouse.'
    group = 'documentation'
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isWindows() }
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'to.sparkapp.app.readme.ReadmeCapture'
    def root = readmeCaptureDirectory.get().asFile
    environment 'WEBVIEW2_USER_DATA_FOLDER', new File(root, 'browser').absolutePath
    systemProperty 'spark.dataDir', new File(root, 'settings').absolutePath
    args new File(root, 'output').absolutePath, project.findProperty('readmeMode') ?: 'tour'
}

// Packaging. Windows builds an application image first, trains its AOT cache inside that image
// (same runtime, classpath and JVM options as the installed launcher), then wraps it in an
// installer. Other platforms still package in one jpackage step without a cache.
def jpackageTool = "${System.getProperty('java.home')}/bin/jpackage${isWindows ? '.exe' : ''}"
def runtimeModules = 'java.desktop,jdk.unsupported,java.logging,java.naming,java.management,java.net.http,jdk.crypto.ec'
def appImageRoot = layout.buildDirectory.dir('app-image')
def installerVersion = isMac && version.toString().startsWith('0.') ? '1' + version.toString().substring(1) : version
def installerIcon = isWindows ? 'src/main/resources/app-icons/icon.ico' :
        isMac ? 'src/main/resources/app-icons/icon.icns' : 'src/main/resources/app-icons/icon.png'

def applicationOptions = { ->
    [
            '--name', 'Spark',
            '--vendor', 'OldValencia',
            '--app-version', installerVersion,
            '--icon', installerIcon,
            '--input', 'build/install/Spark/lib',
            '--main-jar', "Spark-${version}.jar",
            '--main-class', application.mainClass.get(),
            '--add-modules', runtimeModules,
            *javaOpts.collectMany { ['--java-options', it] }
    ]
}

tasks.register('createAppImage', Exec) {
    dependsOn installDist
    group = 'distribution'
    description = 'Builds the Windows application image that the installer wraps.'
    onlyIf { isWindows }

    // java.exe stays in the runtime: the AOT training run needs the exact runtime it will use.
    commandLine jpackageTool, '--type', 'app-image', '--dest', appImageRoot.get().asFile.path,
            '--jlink-options', '--strip-debug --no-man-pages --no-header-files', *applicationOptions()

    doFirst {
        delete appImageRoot
    }
}

tasks.register('trainAot', Exec) {
    dependsOn 'createAppImage'
    group = 'distribution'
    description = 'Records the AOT cache inside the application image with a short training run.'
    onlyIf { isWindows }

    def image = appImageRoot.get().dir('Spark').asFile
    def app = new File(image, 'app')
    def cache = new File(app, 'spark.aot')
    def trainingData = layout.buildDirectory.dir('aot-training').get().asFile

    // The launcher's own settings decide the command, so the cache matches what Spark.exe starts with.
    doFirst {
        def settings = new File(app, 'Spark.cfg').readLines()
        def values = { prefix -> settings.findAll { it.startsWith(prefix) }.collect { it.substring(prefix.length()) } }
        def classpath = values('app.classpath=').collect { it.replace('$APPDIR', app.path) }
        def options = values('java-options=').collect { it.replace('$APPDIR', app.path) }
                .findAll { !it.startsWith('-XX:AOTCache=') && !it.startsWith('-Djpackage.app-version') }

        delete cache, trainingData
        // The training run opens a real browser; keep its profile with the other disposable training data.
        environment 'WEBVIEW2_USER_DATA_FOLDER', new File(trainingData, 'browser').path
        commandLine([new File(image, 'runtime/bin/java.exe').path] + options + [
                "-XX:AOTCacheOutput=${cache.path}",
                '-Dspark.aot.training=true',
                // Training runs until the first site starts loading; writing that many classes needs more
                // room than Spark's own metaspace limit. The installed launcher keeps its limit.
                '-XX:MaxMetaspaceSize=192m',
                "-Dspark.dataDir=${trainingData.path}",
                '-cp', classpath.join(File.pathSeparator),
                values('app.mainclass=').first()])
    }

    doLast {
        if (!cache.isFile()) {
            throw new GradleException('The AOT training run did not produce a cache')
        }
    }
}

// jpackage has no option for the WiX bitmaps, so the JDK's own main.wxs gets two WixVariable lines.
// Reading it from the running JDK keeps the rest of the file in step with the jpackage that uses it.
def installerArt = layout.projectDirectory.dir('src/installer/windows')
def installerResources = layout.buildDirectory.dir('installer-resources')

tasks.register('prepareInstallerResources') {
    group = 'distribution'
    description = 'Writes the WiX source that shows the Spark artwork in the Windows installer.'
    onlyIf { isWindows }
    inputs.files(installerArt.file('banner.bmp'), installerArt.file('dialog.bmp'))
    outputs.dir(installerResources)

    doLast {
        def jdkModules = java.nio.file.FileSystems.getFileSystem(URI.create('jrt:/'))
        def jdkMainWxs = jdkModules.getPath('/modules/jdk.jpackage/jdk/jpackage/internal/resources/main.wxs')
        def source = java.nio.file.Files.readString(jdkMainWxs)
        def anchor = '<UIRef Id="JpUI"/>'

        if (!source.contains(anchor)) {
            throw new GradleException("The JDK's main.wxs no longer contains $anchor")
        }

        def art = installerArt.asFile
        def variables = """<WixVariable Id="WixUIBannerBmp" Value="${new File(art, 'banner.bmp')}"/>
    <WixVariable Id="WixUIDialogBmp" Value="${new File(art, 'dialog.bmp')}"/>
    $anchor"""
        def target = installerResources.get().file('main.wxs').asFile

        target.parentFile.mkdirs()
        target.text = source.replace(anchor, variables)
    }
}

tasks.register('createInstaller', Exec) {
    group = 'distribution'
    description = 'Builds a standalone installer using jpackage'
    dependsOn(isWindows ? ['trainAot', 'prepareInstallerResources'] : installDist)

    def windowsOptions = [
            '--win-dir-chooser',
            '--win-menu',
            '--win-shortcut-prompt',
            '--win-per-user-install',
            '--win-upgrade-uuid', 'f3c4e5d6-a7b8-9c0d-1e2f-3a4b5c6d7e8f',
            '--resource-dir', installerResources.get().asFile.path
    ]
    def macOptions = [
            '--mac-package-identifier', 'to.sparkapp.app',
            '--mac-package-name', 'Spark',
            '--mac-entitlements', 'src/main/resources/mac/entitlements.plist',
            '--resource-dir', 'src/main/resources/mac'
    ]

    if (isWindows) {
        commandLine jpackageTool, '--type', 'exe', '--dest', 'build/installer',
                '--app-image', appImageRoot.get().dir('Spark').asFile.path,
                '--name', 'Spark', '--vendor', 'OldValencia', '--app-version', installerVersion, *windowsOptions
    } else {
        commandLine jpackageTool, '--type', isMac ? 'dmg' : 'deb', '--dest', 'build/installer',
                *applicationOptions(), *(isMac ? macOptions : [])
    }

    doFirst {
        if (isMac && installerVersion != version) {
            println "MacOS requires version >= 1. Patching installer version to: $installerVersion"
        }

        println "Building installer using: $jpackageTool"
        file('build/installer').mkdirs()
    }
}
